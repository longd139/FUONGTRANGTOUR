<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bến Xe FUONG TRANG - TikTok Live Mobile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Màn hình chính Stream Overlay tỉ lệ chuẩn điện thoại 9:16 -->
  <main id="game-stage">
    <!-- BIỂN HIỆU FƯỜNG TRANG PHÁT SÁNG NẰM TRÊN CÙNG (TRÊN HÌNH XE KHÁCH) -->
    <div class="main-signboard-wrap">
      <img src="public/Illuminated Orange FƯỜNG TRANG Signage.png" alt="Biển hiệu FƯỜNG TRANG" class="signboard-img">
    </div>

    <!-- PHẦN THÔNG TIN CHUYẾN XE -->
    <header class="top-header-section">
      <div class="trip-board">
        <div class="trip-info">
          <span class="trip-dest">🚌 SÀI GÒN ➔ ĐÀ LẠT</span>
          <span class="trip-seats">GHẾ: <b id="seat-count">0/10</b></span>
        </div>
        <div class="progress-bar-wrap">
          <div id="trip-progress" class="progress-bar-fill" style="width: 0%"></div>
        </div>
      </div>
    </header>

    <!-- KHU VỰC XE KHÁCH FUONG TRANG (ĐƯỢC ĐƯA LÊN CAO) -->
    <section class="bus-dock-section">
      <div class="bus-container" id="fuong-trang-bus">
        <img src="public/removeBg.png" alt="Xe khách FUONG TRANG" class="bus-photo" id="bus-photo">
        
        <!-- Ống khói khi khởi hành -->
        <div class="bus-exhaust" id="bus-exhaust">
          <div class="smoke-puff p1"></div>
          <div class="smoke-puff p2"></div>
          <div class="smoke-puff p3"></div>
        </div>
      </div>
      <div class="road-track"></div>
    </section>

    <!-- KHU VỰC 20 SLOT HÀNG CHỜ KHI TẶNG VẬT PHẨM (Ở GIỮA XE VÀ ĐƯỜNG) -->
    <section class="waiting-lounge-container">
      <div class="waiting-lounge">
        <div class="lounge-header">
          <span class="lounge-title">🎟️ 20 SLOT HÀNG CHỜ LÊN XE</span>
          <span class="lounge-counter" id="slot-counter">0/20</span>
        </div>
        <div class="seats-grid" id="seats-grid">
          <!-- 20 slot do JavaScript render -->
        </div>
      </div>
    </section>

    <!-- KHU VỰC NGƯỜI CHỜ DƯỚI LÒNG ĐƯỜNG (Ở PHÍA DƯỚI XE) -->
    <section class="zone-far" id="zone-far">
      <div class="zone-badge">
        <span>HÀNH KHÁCH CHỜ DƯỚI ĐƯỜNG (CHƯA CÓ VÉ)</span>
        <small>Tặng hoa / quà để được lên xe!</small>
      </div>
      <div id="far-passengers-container" class="passengers-layer"></div>
    </section>

    <!-- THÔNG BÁO NỔI TOAST -->
    <div id="toast-banner" class="toast-banner hidden">
      <div class="toast-avatar" id="toast-avatar">🌸</div>
      <div class="toast-content">
        <div class="toast-title" id="toast-title">CẢM ƠN DONATE!</div>
        <div class="toast-desc" id="toast-desc">Hành khách vừa đặt vé xe VIP!</div>
      </div>
    </div>
  </main>

  <!-- BẢNG ĐIỀU KHIỂN TEST DÀNH CHO STREAMER -->
  <aside class="test-panel" id="test-panel">
    <div class="test-panel-header">
      <h3>🎮 TEST TIKTOK LIVE</h3>
      <button id="btn-toggle-panel" title="Thu gọn/Mở rộng">_</button>
    </div>
    <div class="test-panel-body">
      <p class="panel-hint">Mô phỏng sự kiện trên màn hình dọc:</p>
      
      <div class="test-group">
        <label>1. Người xem vào phòng live:</label>
        <div class="input-row">
          <input type="text" id="input-username" placeholder="Nhập tên..." value="Bác Ba Phi">
          <button id="btn-simulate-join" class="btn btn-join">🚶 Vào xem</button>
        </div>
      </div>

      <div class="test-group">
        <label>2. Người xem tặng quà:</label>
        <div class="input-row">
          <select id="select-gift">
            <option value="🌸 Hoa Hồng">🌸 Tặng Hoa</option>
            <option value="🍦 Cây Kem">🍦 Tặng Kem</option>
            <option value="🧢 Nón Lá">🧢 Tặng Nón</option>
            <option value="💖 Trái Tim">💖 Tặng Tim</option>
          </select>
          <button id="btn-simulate-gift" class="btn btn-gift">🎁 Tặng Quà</button>
        </div>
      </div>

      <div class="test-group">
        <label>3. Thử nghiệm nhanh:</label>
        <div class="action-grid">
          <button id="btn-quick-fill" class="btn btn-outline">⚡ Lên đủ 20 người</button>
          <button id="btn-depart" class="btn btn-warning">🚌 Xuất bến ngay</button>
          <button id="btn-reset" class="btn btn-danger">🔄 Đặt lại bến</button>
        </div>
      </div>

      <div class="test-group">
        <label>
          <input type="checkbox" id="chk-auto-demo"> Tự động chạy (Auto Demo)
        </label>
      </div>
    </div>
  </aside>

  <script src="main.js"></script>
</body>
</html>
